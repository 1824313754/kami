name: Publish Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: 1824313754/kami

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-python.txt

      - name: Verify 2FA and authorization retries
        run: |
          pip install -r requirements-python.txt
          python -B tools/verify_reauth_retry.py
          python -B - <<'PY'
          import runpy
          from pathlib import Path
          checks = runpy.run_path('tools/verify_two_factor.py')
          checks['check_totp']()
          checks['check_mfa']()
          checks = runpy.run_path('tools/verify_local_auth_store.py')
          checks['routes'].JOB_HISTORY_PATH = Path(checks['workspace']) / 'task_history.json'
          checks['routes'].EXTRACTION_JOBS.clear()
          checks['main']()
          PY

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published image starts
        run: |
          docker run -d --name kami-smoke -p 127.0.0.1:8099:8099 \
            -e PYFAKA_ADMIN_PASSWORD=ci-smoke-test-password \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8099/api/query/stock >/dev/null; then
              curl --fail --silent http://127.0.0.1:8099/query >/dev/null
              docker rm -f kami-smoke
              exit 0
            fi
            sleep 2
          done
          docker logs kami-smoke
          docker rm -f kami-smoke
          exit 1
